name: CI / Full-Stack Verification & Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build, Typecheck, and Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Frontend Typecheck & Production Build
        run: npm run build --prefix frontend

      - name: Launch Backend Test Server
        run: |
          node backend/server.js &
          sleep 3

      - name: Execute Cyber-Security Verification Suite
        run: node verify-security.js

      - name: Execute Full System End-to-End Suite
        run: node verify-system.js
